name: tests

# The unit tests mock the Kafka/Redis clients and use synthetic fixtures, so no broker,
# Docker, or raw StatsBomb data is required -- the suite runs from a clean checkout.

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: '**/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with branch coverage
        # Project standard: 100% branch coverage across scripts/ (see README S10).
        # What may be excluded from that number, and why, is itself enforced -- see
        # tests/unit/test_coverage_exclusions.py.
        run: |
          python -m pytest -q --cov=scripts --cov-branch \
            --cov-report=term-missing --cov-fail-under=100
