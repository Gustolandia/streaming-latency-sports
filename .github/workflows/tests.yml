name: tests

# The unit tests mock the Kafka/Redis clients and use synthetic fixtures, so no broker,
# Docker, or raw StatsBomb data is required -- the suite runs from a clean checkout.

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: '**/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install the fonts and PDF text extractor the gates read with
        # The figure gates lay text out in Arial on the author's machine; Liberation Sans is its
        # metric-compatible substitute, and figure_style.py falls back to it. The rendered-prose
        # gates compare words extracted by xpdf's pdftotext 4.06, the version the author runs;
        # Ubuntu's pdftotext is poppler's, a different extractor. `test -x` fails the step loudly
        # if the unpacked path is wrong, rather than letting those gates skip. xpdf's own `-v`
        # exits 99 even when it works, which is what broke this step's first version.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
          curl -fsSL https://dl.xpdfreader.com/xpdf-tools-linux-4.06.tar.gz | tar -xz -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/xpdf-tools-linux-4.06/bin64/pdftotext"
          "$RUNNER_TEMP/xpdf-tools-linux-4.06/bin64/pdftotext" -v || true
          echo "$RUNNER_TEMP/xpdf-tools-linux-4.06/bin64" >> "$GITHUB_PATH"

      - name: Run tests with branch coverage
        # Project standard: 100% branch coverage across scripts/ (see README S10).
        # What may be excluded from that number, and why, is itself enforced -- see
        # tests/unit/test_coverage_exclusions.py.
        #
        # The number is held on 3.11 only. Before Python 3.10 the compiler folds an
        # `if ...: continue` into the jump ahead of it, so the `continue` line never reports
        # running, and 3.9 calls such lines missed even when the tests take them. Every test
        # still runs on 3.9; only the count is not held against it.
        run: |
          floor=100
          if [ "${{ matrix.python-version }}" = "3.9" ]; then floor=0; fi
          python -m pytest -q -rs --cov=scripts --cov-branch \
            --cov-report=term-missing --cov-fail-under=$floor

  test-windows:
    # The same suite on Windows, the author's own machine's platform. Until 27 September nothing
    # ran it there but that machine, and it skipped every test of a shell script: what those tests
    # caught on Linux went unseen on Windows, and what Windows alone gets wrong went unseen here.
    # The shell tests run in Git's bash, and the two that test what the Linux kernel does with the
    # queue's lock run in WSL's Ubuntu 22.04, the drivers' own release (tests/posix_shell.py).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: '**/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install the PDF text extractor the gates read with
        # xpdf's pdftotext and pdffonts 4.06, as on Linux; Arial is already on Windows.
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.xpdfreader.com/xpdf-tools-win-4.06.zip -OutFile "$env:RUNNER_TEMP\xpdf.zip"
          Expand-Archive "$env:RUNNER_TEMP\xpdf.zip" -DestinationPath "$env:RUNNER_TEMP"
          $bin = "$env:RUNNER_TEMP\xpdf-tools-win-4.06\bin64"
          if (-not (Test-Path "$bin\pdftotext.exe")) { throw "pdftotext is not at $bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Install Ubuntu 22.04 in WSL, for the tests of what the Linux kernel does
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-22.04

      - name: Run tests with branch coverage
        shell: pwsh
        run: |
          python -m pytest -q -rs --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100
