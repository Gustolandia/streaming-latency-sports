name: tests

# The unit tests mock the Kafka/Redis clients and use synthetic fixtures, so no broker,
# Docker, or raw StatsBomb data is required -- the suite runs from a clean checkout.

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: '**/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install the fonts and PDF text extractor the gates read with
        # The figure gates lay text out in Arial on the author's machine; Liberation Sans is its
        # metric-compatible substitute, and figure_style.py falls back to it. The rendered-prose
        # gates compare words extracted by xpdf's pdftotext 4.06, the version the author runs;
        # Ubuntu's pdftotext is poppler's, a different extractor. `test -x` fails the step loudly
        # if the unpacked path is wrong, rather than letting those gates skip. xpdf's own `-v`
        # exits 99 even when it works, which is what broke this step's first version.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
          curl -fsSL https://dl.xpdfreader.com/xpdf-tools-linux-4.06.tar.gz | tar -xz -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/xpdf-tools-linux-4.06/bin64/pdftotext"
          "$RUNNER_TEMP/xpdf-tools-linux-4.06/bin64/pdftotext" -v || true
          echo "$RUNNER_TEMP/xpdf-tools-linux-4.06/bin64" >> "$GITHUB_PATH"

      - name: Run tests with branch coverage
        # Project standard: 100% branch coverage across scripts/ (see README S10).
        # What may be excluded from that number, and why, is itself enforced -- see
        # tests/unit/test_coverage_exclusions.py.
        run: |
          python -m pytest -q --cov=scripts --cov-branch \
            --cov-report=term-missing --cov-fail-under=100
