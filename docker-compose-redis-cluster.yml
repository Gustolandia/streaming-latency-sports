services:
  redis1:
    image: redis:7.2.4
    container_name: sbl_redis1
    ports:
      - "7000:7000"
      - "17000:17000"
    command: redis-server --port 7000 --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --appendonly yes --appendfilename "appendonly.aof" --appendfsync everysec
    volumes:
      - ./redis_cluster/7000:/data
    networks:
      - redis-net
    restart: unless-stopped

  redis2:
    image: redis:7.2.4
    container_name: sbl_redis2
    ports:
      - "7001:7001"
      - "17001:17001"
    command: redis-server --port 7001 --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --appendonly yes --appendfilename "appendonly.aof" --appendfsync everysec
    volumes:
      - ./redis_cluster/7001:/data
    networks:
      - redis-net
    restart: unless-stopped

  redis3:
    image: redis:7.2.4
    container_name: sbl_redis3
    ports:
      - "7002:7002"
      - "17002:17002"
    command: redis-server --port 7002 --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --appendonly yes --appendfilename "appendonly.aof" --appendfsync everysec
    volumes:
      - ./redis_cluster/7002:/data
    networks:
      - redis-net
    restart: unless-stopped

  redis-cluster-init:
    image: redis:7.2.4
    container_name: sbl_redis_cluster_init
    depends_on:
      - redis1
      - redis2
      - redis3
    command: >
      sh -c "
      echo 'Waiting for Redis nodes to be ready...' && \
      sleep 10 && \
      echo 'Creating Redis cluster...' && \
      redis-cli --cluster create redis1:7000 redis2:7001 redis3:7002 --cluster-replicas 0 --cluster-yes && \
      echo 'Cluster created successfully!' || \
      (echo 'Cluster creation may have already been done, checking...' && \
       redis-cli --cluster check redis1:7000 && \
       echo 'Cluster already exists and is healthy')
      "
    networks:
      - redis-net
    restart: on-failure

networks:
  redis-net:
    driver: bridge
